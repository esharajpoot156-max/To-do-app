<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">

    <!-- LOGIN SCREEN -->
    <section id="login-screen" class="screen">
      <h1 class="login-title">TO-DO LIST</h1>
      <h2 class="login-sub">Login to your account</h2>

      <form id="login-form">
        <div class="input-row">
          <span class="input-icon">✉</span>
          <input type="email" id="login-email" placeholder="Email" required />
        </div>
        <div class="input-row">
          <span class="input-icon">🔒</span>
          <input type="password" id="login-password" placeholder="Password" required />
        </div>
        <button type="submit" class="primary-btn">Login</button>
      </form>
    </section>

    <!-- HOME SCREEN -->
    <section id="home-screen" class="screen hidden">
      <header class="top-bar">
        <div class="user">
          <div class="avatar" id="avatar">E</div>
          <div>
            <small>Good Evening!</small>
            <h3 id="user-name">User</h3>
          </div>
        </div>
        <button class="icon-btn" id="logout-btn" title="Logout">⎋</button>
      </header>

      <div class="sheet">
        <div class="tabs" id="tabs">
          <button class="tab active" data-filter="all">My Tasks</button>
          <button class="tab" data-filter="in-progress">In-progress</button>
          <button class="tab" data-filter="completed">Completed</button>
        </div>

        <div class="cards" id="cards"></div>

        <div class="section-head">
          <h3>Today Tasks</h3>
        </div>
        <div id="today-list"></div>
      </div>
    </section>

    <!-- CALENDAR SCREEN -->
    <section id="calendar-screen" class="screen hidden">
      <header class="top-bar center">
        <button class="icon-btn" id="back-btn">‹</button>
        <h3>Today Task</h3>
        <span class="spacer"></span>
      </header>

      <div class="sheet">
        <h2 id="month-label">Month</h2>
        <div class="week-strip" id="week-strip"></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- FLOATING ADD BUTTON -->
    <button id="add-btn" class="fab hidden">+</button>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="bottom-nav hidden">
      <button class="nav-btn active" data-screen="home-screen">🏠</button>
      <button class="nav-btn" data-screen="calendar-screen">📅</button>
    </nav>

    <!-- TASK MODAL -->
    <div id="modal" class="modal hidden">
      <form id="task-form" class="modal-box">
        <h3 id="modal-title">Add Task</h3>
        <input type="hidden" id="task-id" />

        <input type="text" id="task-title" placeholder="Task title" required />
        <textarea id="task-desc" placeholder="Description (optional)" rows="2"></textarea>
        <input type="date" id="task-date" required />

        <div class="row">
          <input type="time" id="task-start" required />
          <input type="time" id="task-end" required />
        </div>

        <select id="task-status">
          <option value="pending">Pending</option>
          <option value="in-progress">In-progress</option>
          <option value="completed">Completed</option>
        </select>

        <div class="row">
          <button type="button" id="cancel-btn" class="ghost-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
